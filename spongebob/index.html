<body>
    <div id=stage>
        <canvas id=canvas tabindex=0></canvas>
        <video id=remote playsinline></video>
    </div>
    <div class=controls id=touch aria-hidden=true>
        <div class="cluster left">
            <div class=shoulders>
                <div class="ctl shoulder" data-btn=256>L2</div>
                <div class="ctl shoulder" data-btn=1024>L1</div>
            </div>
            <div class=dpad data-dpad><span class=up data-dir=16>▲</span><span class=left data-dir=128>◀</span><span class=hub></span> <span class=right data-dir=32>▶</span><span class=down data-dir=64>▼</span></div>
            <div class=stick data-stick>
                <div class=knob id=knob></div>
            </div>
        </div>
        <div class="cluster mid">
            <div class="ctl small" data-btn=1>Select</div>
            <div class="ctl small" data-btn=8>Start</div>
        </div>
        <div class="cluster right">
            <div class=shoulders>
                <div class="ctl shoulder" data-btn=2048>R1</div>
                <div class="ctl shoulder" data-btn=512>R2</div>
            </div>
            <div class=face>
                <div class="ctl tri" data-btn=4096>△</div>
                <div class="ctl sq" data-btn=32768>□</div>
                <div class="ctl ci" data-btn=8192>○</div>
                <div class="ctl cr" data-btn=16384>✕</div>
            </div>
        </div>
    </div>
    <div id=bar><span id=status>Loading…</span><span id=stats></span>
        <button id=menu-toggle type=button aria-controls=menu aria-expanded=false>Menu ▴</button>
        <button id=fullscreen type=button title="Fullscreen (F or double click)">Fullscreen</button>
    </div>
    <div id=menu hidden>
        <select aria-label=Resolution id=scale title="Internal resolution, the page reloads to apply it" class=host-only>
            <option value=1>640×512</option>
            <option value=2>1280×1024</option>
            <option value=3>1920×1536</option>
        </select>
        <select aria-label="Aspect ratio" id=aspect title="Screen shape the game is told about, the page reloads to apply it" class=host-only>
            <option value=4:3>4:3</option>
            <option value=16:9>16:9</option>
        </select>
        <select aria-label="Player 1 gamepad" id=pad title="Gamepad for player 1, the next connected one is player 2 (press a button on a pad if it is missing)">
            <option value="">Pad: auto</option>
        </select>
        <button id=save-state type=button title="Save the game to this device" class=host-only disabled>Save state</button>
        <button id=load-state type=button title="Load the quick save from this device" class=host-only disabled>Load state</button>
        <button id=export-state type=button title="Download the quick save as a .state file" class=host-only>Export state</button>
        <button id=import-state type=button title="Make a .state file the quick save" class=host-only>Import state</button>
        <input id=import-state-file type=file accept=.state hidden>
        <label id=aa-label class=host-only title="Smooth jagged edges, applied immediately">
            <input id=aa type=checkbox disabled> Smooth edges</label>
        <label id=stats-label>
            <input id=stats-toggle type=checkbox> Show stats</label>
        <button id=controls-toggle type=button hidden>Hide controls</button>
        <button id=export-card type=button title="Download the memory card in slot 1 as a .ps2 file" class=host-only>Export card</button>
        <button id=import-card type=button title="Put a .ps2 memory card file in slot 1" class=host-only>Import card</button>
        <input id=import-file type=file accept=.ps2 hidden>
    </div>
    <button id=exit-fullscreen type=button>Exit fullscreen</button>
    <div id=overlay>
        <div id=panel>
            <p hidden id=help></p>
            <button id=start disabled>Loading…</button>
        </div>
    </div>
    <template id=engine>
        <script async src=ps2web.js></script>
    </template>
